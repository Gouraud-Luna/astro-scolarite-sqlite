name: Deploy AstroJS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Ubuntu server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            echo "======================================="
            echo "Début du déploiement"
            echo "======================================="

            cd /var/www/scolarite/astro-scolarite-sqlite

            git config --global --add safe.directory /var/www/scolarite/astro-scolarite-sqlite

            echo "Mise à jour du code depuis main..."
            git fetch origin
            git checkout main
            git pull --ff-only origin main

            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"

            echo "Installation des dépendances..."
            bun install --frozen-lockfile

            echo "Compilation Astro..."
            bun run build

            echo "Redémarrage de l'application..."
            sudo systemctl restart scolarite

            echo "Vérification du service..."
            sudo systemctl status scolarite --no-pager

            echo "Health check..."
            curl --fail http://localhost:3000/

            echo "======================================"
            echo "Déploiement terminé"
            echo "======================================="